# Configuration Apache pour Jeu Couples
# À ajouter dans la configuration du vhost via HestiaCP
# ou dans /etc/apache2/conf.d/

# Activer les modules nécessaires (si pas déjà fait):
# sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers

<VirtualHost *:443>
    ServerName jeu-couples.votredomaine.com
    DocumentRoot /home/ylureault/web/[DOMAIN]/public_html

    # SSL (géré par HestiaCP/Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /home/ylureault/conf/web/[DOMAIN]/ssl/[DOMAIN].crt
    SSLCertificateKeyFile /home/ylureault/conf/web/[DOMAIN]/ssl/[DOMAIN].key

    # Proxy pour l'API
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket support pour Socket.IO
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) ws://localhost:3004/socket.io/$1 [P,L]

    # API proxy
    ProxyPass /api http://localhost:3004/api
    ProxyPassReverse /api http://localhost:3004/api

    # Socket.IO fallback (long-polling)
    ProxyPass /socket.io http://localhost:3004/socket.io
    ProxyPassReverse /socket.io http://localhost:3004/socket.io

    # Health check endpoint
    ProxyPass /health http://localhost:3004/health
    ProxyPassReverse /health http://localhost:3004/health

    # Static files served directly by Apache
    <Directory /home/ylureault/web/[DOMAIN]/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA routing - redirect all non-existing files to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_URI} !^/socket.io
        RewriteRule . /index.html [L]
    </Directory>

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript text/javascript
    </IfModule>

    # Cache control for static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # Logs
    ErrorLog /home/ylureault/web/[DOMAIN]/logs/error.log
    CustomLog /home/ylureault/web/[DOMAIN]/logs/access.log combined
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName jeu-couples.votredomaine.com
    Redirect permanent / https://jeu-couples.votredomaine.com/
</VirtualHost>
